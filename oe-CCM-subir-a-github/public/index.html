<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ruta del Asesor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'%3E%3Crect width='22' height='22' rx='5' fill='%230066FF'/%3E%3Ccircle cx='5' cy='16' r='2.4' fill='white'/%3E%3Ccircle cx='11' cy='11' r='2.4' fill='white'/%3E%3Ccircle cx='17' cy='6' r='2.4' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;800&family=Red+Hat+Text:wght@400;500;600&family=Red+Hat+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/styles.css">
<style>html{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<div class="wrap">
  <header class="top" id="top" hidden>
    <div class="brand">
      <picture class="oe-logo"><source srcset="/logo-openenglish-dark.png" media="(prefers-color-scheme: dark)"><img src="/logo-openenglish.png" alt="Open English" width="112" height="43"></picture>
      <span class="brand-sep" aria-hidden="true"></span>
      <div><h1>Ruta del Asesor</h1><p>Training administrativo · alertas por etapa</p></div>
    </div>
    <div class="who" id="who"></div>
  </header>

  <nav class="rail" role="tablist" aria-label="Etapas" id="rail" hidden>
    <button class="stage" role="tab" data-stage="1" aria-selected="true"><div class="num">1</div><div><b>Reclutamiento</b><span>Screening, alertas y libro de ingresos</span></div></button>
    <button class="stage" role="tab" data-stage="2" aria-selected="false"><div class="num">2</div><div><b>Sala</b><span id="st2-sub">Asistencia, disciplinarios, exámenes</span></div></button>
    <button class="stage" role="tab" data-stage="3" aria-selected="false" disabled><div class="num">3</div><div><b>OJT</b><span>Ventas y calidad · próximamente</span></div></button>
  </nav>

  <main id="main"><div class="panel"><span class="spinner"></span> <span class="muted">Cargando…</span></div></main>
</div>
<div class="toast" id="toast" hidden></div>
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="/app.js"></script>
</body>
</html>
